<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>نمایشگر KML</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  
  <!-- CSS Leaflet از jsDelivr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- نوار ابزار بالا -->
  <div id="toolbar">
    <button id="btn-load" title="بارگذاری فایل KML/KMZ">📂 </button>
    <button id="btn-gps" title="پرش به موقعیت من">📍</button>
    <button id="btn-follow" title="دنبال کردن خودکار">🔄 </button>
    <button id="btn-clear" title="پاک کردن همه">🗑️ </button>
  </div>

  <!-- پنل اطلاعات مسیریابی -->
  <div id="nav-panel" class="hidden">
    <span id="target-name">مقصد انتخاب نشده</span>
    <span id="dist-info"></span>
    <span id="dir-info"></span>
    <button id="btn-clear-target">✖️</button>
  </div>

  <!-- ورودی فایل مخفی -->
  <input type="file" id="file-input" accept=".kml,.kmz" hidden>

  <!-- کتابخانه‌ها از jsDelivr (سازگار با ایران) -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  
  <script src="app.js"></script>
</body>
</html>
